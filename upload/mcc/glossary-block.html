<!-- wp:html -->
<style>.mvt{--t:#0f5560;--p:#e0408f;--bg:#f6f4ff;--line:#e3dcf7;font-family:"Nunito Sans",system-ui,sans-serif;color:#1f2d33;max-width:860px;margin:0 auto 32px;line-height:1.5}
.mvt *{box-sizing:border-box}
.mvt .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin:0 0 18px;box-shadow:0 6px 24px rgba(80,60,160,.07)}
.mvt .hero{background:linear-gradient(135deg,#a9b8ff,#d6c4fb 55%,#f8c7fb);border:0;color:var(--t)}
.mvt .hero h2{margin:0 0 6px;font-size:26px;color:var(--t)}
.mvt .hero p{margin:0;color:#24474d}
.mvt .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.mvt label{display:block;font-weight:700;font-size:14px;margin:0 0 6px;color:var(--t)}
.mvt .field{margin:0 0 4px}
.mvt .row{display:flex;gap:10px;align-items:center}
.mvt input[type=number],.mvt select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:16px;background:#fff;color:#1f2d33}
.mvt input[type=range]{width:100%;accent-color:var(--p)}
.mvt input:focus,.mvt select:focus{outline:none;border-color:var(--p)}
.mvt .hint{font-size:12.5px;color:#5c6b70;margin-top:3px}
.mvt .btn{display:inline-block;background:var(--t);color:#fff!important;border:0;border-radius:999px;padding:11px 22px;font-weight:800;font-size:15px;cursor:pointer;text-decoration:none}
.mvt .btn.alt{background:var(--p)}
.mvt .btn.ghost{background:#fff;color:var(--t)!important;border:1.5px solid var(--t)}
.mvt .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:6px}
.mvt .stat{background:var(--bg);border-radius:12px;padding:14px}
.mvt .stat .k{font-size:13px;color:#5c6b70}
.mvt .stat .v{font-size:22px;font-weight:900;color:var(--t)}
.mvt .stat.big .v{font-size:28px;color:var(--p)}
.mvt .bar{height:14px;border-radius:999px;background:#eee;overflow:hidden;display:flex;margin:12px 0 6px}
.mvt .bar span{display:block;height:100%}
.mvt .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px}
.mvt .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.mvt .note{background:#fff7fb;border-left:4px solid var(--p);padding:12px 14px;border-radius:8px;font-size:14.5px}
.mvt table{width:100%;border-collapse:collapse;font-size:14px}
.mvt th,.mvt td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right}
.mvt th:first-child,.mvt td:first-child{text-align:left}
.mvt .muted{color:#5c6b70;font-size:13px}
.mvt .links a{color:var(--p);font-weight:700}
.mvt h3{color:var(--t);margin:0 0 10px;font-size:19px}
@media(max-width:520px){.mvt .card{padding:16px}.mvt .hero h2{font-size:22px}}
.mvt td:last-child{white-space:nowrap}
.mvt a:not(.btn){color:var(--p)}
</style>
<style>
#mv-gl .gl-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#mv-gl .gl-search{flex:1 1 260px;position:relative}
#mv-gl .gl-search input{width:100%;padding:12px 14px 12px 42px;border:1.5px solid var(--line);border-radius:999px;font-size:16px;background:#fff;color:#1f2d33;font-family:inherit}
#mv-gl .gl-search input:focus{outline:none;border-color:var(--p)}
#mv-gl .gl-search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px}
#mv-gl .gl-lang{display:flex;background:var(--bg);border-radius:999px;padding:4px;gap:4px}
#mv-gl .gl-lang button{border:0;background:transparent;border-radius:999px;padding:9px 16px;min-height:42px;font:inherit;font-weight:800;color:var(--t);cursor:pointer}
#mv-gl .gl-lang button[aria-pressed=true]{background:var(--t);color:#fff}
#mv-gl .gl-az{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
#mv-gl .gl-az button{min-width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font:inherit;font-weight:800;color:var(--t);cursor:pointer;padding:0 8px}
#mv-gl .gl-az button[aria-pressed=true]{background:var(--p);border-color:var(--p);color:#fff}
#mv-gl .gl-az button:disabled{opacity:.35;cursor:default}
#mv-gl button:focus-visible{outline:3px solid var(--p);outline-offset:2px}
#mv-gl .gl-count{margin:12px 2px 0;font-size:13.5px;color:#5c6b70}
#mv-gl .gl-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
#mv-gl .gl-c{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;box-shadow:0 6px 24px rgba(80,60,160,.06);display:flex;flex-direction:column;position:relative;overflow:hidden}
#mv-gl .gl-c:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(#a9b8ff,#e0408f)}
#mv-gl .gl-c h4{margin:0;font-size:18px;color:var(--t);line-height:1.3}
#mv-gl .gl-c .gl-alt{font-size:14px;color:var(--p);font-weight:700;margin:2px 0 8px}
#mv-gl .gl-c p{margin:0 0 8px;font-size:15px}
#mv-gl .gl-c .gl-ex{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:13.5px;color:#24474d;margin-top:auto}
#mv-gl .gl-c .gl-ex b{color:var(--t)}
#mv-gl .gl-c mark{background:#ffe3f1;color:inherit;border-radius:3px;padding:0 1px}
#mv-gl .gl-empty{text-align:center;padding:30px 10px;color:#5c6b70}
#mv-gl .gl-foot{font-size:12.5px;color:#5c6b70;text-align:center;margin:6px 0 0}
@media(max-width:520px){#mv-gl .gl-lang{width:100%}#mv-gl .gl-lang button{flex:1}#mv-gl .gl-az button{min-width:36px;height:40px}#mv-gl .gl-list{grid-template-columns:1fr}}
</style>
