<style>

#mv-gl .gl-az button[aria-pressed=true]{background:var(--p);border-color:var(--p);color:#fff}

#mv-gl button:focus-visible{outline:3px solid var(--p);outline-offset:2px}
#mv-gl .gl-count{margin:12px 2px 0;font-size:13.5px;color:#5c6b70}
#mv-gl .gl-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
#mv-gl .gl-c{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;box-shadow:0 6px 24px rgba(80,60,160,.06);display:flex;flex-direction:column;position:relative;overflow:hidden}

#mv-gl .gl-c .gl-alt{font-size:14px;color:var(--p);font-weight:700;margin:2px 0 8px}

#mv-gl .gl-c .gl-ex{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:13.5px;color:#24474d;margin-top:auto}
#mv-gl .gl-c .gl-ex b{color:var(--t)}
#mv-gl .gl-c mark{background:#ffe3f1;color:inherit;border-radius:3px;padding:0 1px}
#mv-gl .gl-empty{text-align:center;padding:30px 10px;color:#5c6b70}
#mv-gl .gl-foot{font-size:12.5px;color:#5c6b70;text-align:center;margin:6px 0 0}
@media(max-width:520px){#mv-gl .gl-lang{width:100%}#mv-gl .gl-lang button{flex:1}#mv-gl .gl-az button{min-width:36px;height:40px}#mv-gl .gl-list{grid-template-columns:1fr}}
</style>

<script>
(function(){var R=document.getElementById('mv-gl');if(!R)return;var $=function(i){return document.getElementById(i)};
const DATA=[{"term":"Aadhaar-PAN link","hindi":"आधार-पैन लिंक","en":"Connecting your Aadhaar number with your PAN in the income tax records. It helps match your identity across records, and an unlinked PAN can cause problems with tax filing and some money tasks.","hi":"आधार नंबर को पैन से जोड़ना, ताकि टैक्स और बैंक के कामों में दिक्कत न आए।","example":"Before filing your ITR, check on the official income tax website that your PAN and Aadhaar are linked.","letter":"A","exh":"ITR भरने से पहले आयकर विभाग की आधिकारिक वेबसाइट पर जाँच लें कि आपका पैन और आधार जुड़े हुए हैं।"},{"term":"Annuity","hindi":"वार्षिकी (एन्युटी)","en":"A product where you pay a lump sum (or instalments) and in return get a regular income, often for life. It is commonly used to create a pension after retirement.","hi":"एकमुश्त रकम देकर बदले में हर महीने या साल नियमित आय पाना।","example":"At retirement, someone might use part of their savings to buy an annuity that pays a fixed amount every month.","letter":"A","exh":"रिटायरमेंट पर कोई व्यक्ति अपनी बचत के एक हिस्से से एन्युटी खरीद सकता है, जो हर महीने एक तय रकम देती है।"},{"term":"Asset","hindi":"संपत्ति","en":"Anything you own that has money value or can earn money, like savings, investments, gold or a house.","hi":"आपके पास मौजूद कोई भी चीज़ जिसकी पैसों में कीमत हो।","example":"Your ₹50,000 FD and your gold jewellery are both assets.","letter":"A","exh":"आपकी ₹50,000 की FD और आपके सोने के गहने, दोनों आपकी संपत्ति हैं।"},{"term":"Asset allocation","hindi":"एसेट एलोकेशन (निवेश का बँटवारा)","en":"How you divide your investments between types like equity, debt, gold and cash. It is set based on your goals, time horizon and comfort with risk.","hi":"अपने निवेश को इक्विटी, डेट, सोना और नकद में कितना-कितना बाँटना है, यह तय करना।","example":"Out of ₹1,00,000, keeping ₹60,000 in equity funds, ₹30,000 in debt and ₹10,000 in gold is one example of asset allocation.","letter":"A","exh":"₹1,00,000 में से ₹60,000 इक्विटी फंड में, ₹30,000 डेट में और ₹10,000 सोने में रखना एसेट एलोकेशन का एक उदाहरण है।"},{"term":"ATM PIN","hindi":"एटीएम पिन","en":"A secret number you use with your debit card at ATMs and shops. Never share it with anyone, not even someone claiming to be from your bank.","hi":"डेबिट कार्ड का गुप्त नंबर, जिसे किसी को भी नहीं बताना चाहिए।","example":"","letter":"A"},{"term":"Auto-debit","hindi":"ऑटो-डेबिट","en":"A standing instruction that lets a company or bank take a fixed payment from your account on a set date, such as an EMI, SIP or bill. It helps you never miss a payment, but keep enough balance on that date.","hi":"तय तारीख पर खाते से अपने-आप पैसा कटने की व्यवस्था।","example":"A ₹2,000 SIP set on auto-debit is taken from your account on the 5th of every month.","letter":"A","exh":"ऑटो-डेबिट पर लगी ₹2,000 की SIP हर महीने की 5 तारीख को आपके खाते से कट जाती है।"},{"term":"Bear market","hindi":"मंदी का बाज़ार (बेयर मार्केट)","en":"A period when share prices fall a lot and stay low for some time. Such phases are a normal part of markets over the long term.","hi":"जब शेयर बाज़ार में कीमतें लंबे समय तक काफ़ी गिरती रहें।","example":"","letter":"B"},{"term":"Bond","hindi":"बॉन्ड","en":"A loan you give to a government or company. In return they promise to pay you interest and return your money on a fixed date.","hi":"सरकार या कंपनी को दिया गया कर्ज़, जिस पर ब्याज मिलता है और तय तारीख पर पैसा वापस आता है।","example":"You lend ₹10,000 through a bond for 5 years and get interest every year, then your ₹10,000 back at the end.","letter":"B","exh":"आप एक बॉन्ड के ज़रिए 5 साल के लिए ₹10,000 उधार देते हैं, हर साल ब्याज पाते हैं और आखिर में आपके ₹10,000 वापस मिल जाते हैं।"},{"term":"Budget","hindi":"बजट","en":"A simple plan for how you will use your money each month: what comes in, what goes out, and what you save.","hi":"हर महीने की आमदनी, खर्च और बचत की योजना।","example":"Income ₹40,000: ₹24,000 for needs, ₹8,000 for wants and ₹8,000 for savings.","letter":"B","exh":"आय ₹40,000: ज़रूरतों के लिए ₹24,000, चाहतों के लिए ₹8,000 और बचत के लिए ₹8,000।"},{"term":"Bull market","hindi":"तेज़ी का बाज़ार (बुल मार्केट)","en":"A period when share prices rise steadily for some time and investors feel confident.","hi":"जब शेयर बाज़ार में कीमतें लगातार बढ़ती रहें।","example":"","letter":"B"},{"term":"Capital gain","hindi":"पूंजीगत लाभ","en":"The profit you make when you sell something, like shares, mutual fund units, gold or property, for more than you paid.","hi":"किसी चीज़ को खरीद से ज़्यादा कीमत पर बेचने पर हुआ मुनाफ़ा।","example":"You buy gold for ₹50,000 and later sell it for ₹60,000. Your capital gain is ₹10,000.","letter":"C","exh":"आप ₹50,000 का सोना खरीदते हैं और बाद में ₹60,000 में बेचते हैं। आपका पूंजीगत लाभ ₹10,000 है।"},{"term":"Cash flow","hindi":"नकदी प्रवाह (कैश फ़्लो)","en":"The money moving in and out of your hands over a period. Positive cash flow means more comes in than goes out.","hi":"किसी समय में आने और जाने वाले पैसे का हिसाब।","example":"Salary ₹35,000 in, spending ₹30,000 out: your monthly cash flow is +₹5,000.","letter":"C","exh":"₹35,000 वेतन आया, ₹30,000 खर्च हुए: आपका मासिक कैश फ्लो +₹5,000 है।"},{"term":"Cashless claim","hindi":"कैशलेस क्लेम","en":"A health insurance claim where the insurer pays the network hospital directly, so you don't pay the covered amount upfront.","hi":"जब बीमा कंपनी सीधे अस्पताल को भुगतान करे और आपको पहले पैसे न देने पड़ें।","example":"","letter":"C"},{"term":"Claim","hindi":"क्लेम (दावा)","en":"A formal request to your insurer to pay for a loss or expense that your policy covers.","hi":"बीमा कंपनी से पॉलिसी के तहत भुगतान माँगना।","example":"After a hospital stay costing ₹80,000, you file a claim with your health insurer.","letter":"C","exh":"₹80,000 के अस्पताल खर्च के बाद आप अपनी स्वास्थ्य बीमा कंपनी के पास क्लेम दर्ज करते हैं।"},{"term":"Claim settlement ratio","hindi":"क्लेम सेटलमेंट रेशियो","en":"The share of claims an insurer paid out of all claims it received in a year. It is one of several things people look at when comparing insurers.","hi":"किसी बीमा कंपनी ने कुल दावों में से कितने प्रतिशत दावों का भुगतान किया।","example":"If an insurer received 1,000 claims and settled 950, its claim settlement ratio is 95%.","letter":"C","exh":"अगर किसी बीमा कंपनी को 1,000 क्लेम मिले और उसने 950 का निपटारा किया, तो उसका क्लेम सेटलमेंट रेशियो 95% है।"},{"term":"Co-pay","hindi":"को-पे","en":"In health insurance, the fixed share of every claim that you pay yourself, with the insurer paying the rest.","hi":"स्वास्थ्य बीमा में हर क्लेम का वह हिस्सा जो आपको खुद देना होता है।","example":"With a 10% co-pay on a ₹1,00,000 bill, you pay ₹10,000 and the insurer pays ₹90,000.","letter":"C","exh":"₹1,00,000 के बिल पर 10% को-पे हो तो ₹10,000 आप देते हैं और ₹90,000 बीमा कंपनी देती है।"},{"term":"Collateral","hindi":"गिरवी (कोलैटरल)","en":"Something valuable you pledge to a lender to get a loan, like gold, property or an FD. The lender can keep it if the loan is not repaid.","hi":"कर्ज़ लेने के लिए गिरवी रखी गई कीमती चीज़।","example":"In a gold loan, your gold jewellery is the collateral.","letter":"C","exh":"गोल्ड लोन में आपके सोने के गहने कोलैटरल (गिरवी) होते हैं।"},{"term":"Compound interest","hindi":"चक्रवृद्धि ब्याज","en":"Interest earned on your original money plus on the interest already added. Over many years, this \"interest on interest\" makes money grow much faster.","hi":"मूल रकम और पहले मिले ब्याज, दोनों पर ब्याज मिलना।","example":"₹10,000 at an assumed 10% a year becomes ₹11,000 after 1 year and ₹12,100 after 2 years, not ₹12,000.","letter":"C","exh":"मान लें 10% सालाना ब्याज पर ₹10,000, 1 साल बाद ₹11,000 और 2 साल बाद ₹12,100 बन जाते हैं, ₹12,000 नहीं।"},{"term":"Credit card","hindi":"क्रेडिट कार्ड","en":"A card that lets you borrow money to pay now and repay the bank later. If you pay the full bill by the due date it can be interest-free, but unpaid balances usually attract very high interest.","hi":"अभी खर्च करके बाद में बैंक को चुकाने वाला कार्ड; पूरा बिल समय पर न भरने पर भारी ब्याज लगता है।","example":"","letter":"C"},{"term":"Credit limit","hindi":"क्रेडिट लिमिट","en":"The maximum amount you can spend on a credit card or borrow on a credit line.","hi":"क्रेडिट कार्ड पर अधिकतम खर्च करने की सीमा।","example":"A card with a ₹1,00,000 limit lets you spend up to ₹1,00,000 before paying back.","letter":"C","exh":"₹1,00,000 लिमिट वाले कार्ड से आप चुकाने से पहले ₹1,00,000 तक खर्च कर सकते हैं।"},{"term":"Credit score","hindi":"क्रेडिट स्कोर","en":"A number that shows how reliably you have repaid loans and card bills in the past. Lenders check it when you apply for a loan or card.","hi":"आपने कर्ज़ और कार्ड बिल कितने समय पर चुकाए, यह बताने वाला अंक।","example":"Paying every EMI and card bill on time, month after month, helps build a good credit score.","letter":"C","exh":"हर महीने हर EMI और कार्ड बिल समय पर चुकाने से अच्छा क्रेडिट स्कोर बनता है।"},{"term":"Credit utilisation","hindi":"क्रेडिट उपयोग अनुपात","en":"How much of your total credit card limit you are using. Using a smaller share of your limit is generally seen as healthier.","hi":"कुल क्रेडिट लिमिट में से आप कितना हिस्सा इस्तेमाल कर रहे हैं।","example":"Spending ₹30,000 on a card with a ₹1,00,000 limit means 30% credit utilisation.","letter":"C","exh":"₹1,00,000 लिमिट वाले कार्ड पर ₹30,000 खर्च करने का मतलब है 30% क्रेडिट उपयोग।"},{"term":"Debit card","hindi":"डेबिट कार्ड","en":"A card that takes money straight from your bank account when you pay or withdraw cash. You spend your own money, not borrowed money.","hi":"ऐसा कार्ड जिससे भुगतान करने पर पैसा सीधे आपके बैंक खाते से कटता है।","example":"","letter":"D"},{"term":"Debt","hindi":"कर्ज़ (ऋण)","en":"Money you have borrowed and must pay back, usually with interest, like a loan or unpaid credit card bill.","hi":"उधार लिया गया पैसा जिसे ब्याज के साथ लौटाना होता है।","example":"","letter":"D"},{"term":"Debt fund","hindi":"डेट फंड","en":"A mutual fund that invests mainly in bonds, government securities and similar lending instruments. Its value usually moves less than equity funds, but it is not risk-free.","hi":"ऐसा म्यूचुअल फंड जो मुख्य रूप से बॉन्ड और कर्ज़-आधारित साधनों में निवेश करता है।","example":"","letter":"D"},{"term":"Deductible","hindi":"डिडक्टिबल","en":"In insurance, the amount you must pay yourself before the insurer starts paying for a claim.","hi":"बीमा में वह रकम जो क्लेम शुरू होने से पहले आपको खुद चुकानी पड़ती है।","example":"With a ₹25,000 deductible and a ₹1,00,000 bill, you pay ₹25,000 and the insurer pays the remaining covered ₹75,000.","letter":"D","exh":"₹25,000 डिडक्टिबल और ₹1,00,000 के बिल पर ₹25,000 आप देते हैं और बाकी कवर किए गए ₹75,000 बीमा कंपनी देती है।"},{"term":"Demat account","hindi":"डीमैट खाता","en":"An account that holds your shares and other securities in electronic form, like a bank account for investments.","hi":"शेयर और दूसरे निवेश इलेक्ट्रॉनिक रूप में रखने वाला खाता।","example":"","letter":"D"},{"term":"Depreciation","hindi":"मूल्यह्रास","en":"The fall in value of something over time due to use or age, like a car, bike or phone.","hi":"समय और इस्तेमाल के साथ किसी चीज़ की कीमत का घटना।","example":"A ₹80,000 bike may be worth around ₹50,000 after a few years.","letter":"D","exh":"₹80,000 की बाइक की कीमत कुछ साल बाद लगभग ₹50,000 रह सकती है।"},{"term":"Direct vs regular plan","hindi":"डायरेक्ट बनाम रेगुलर प्लान","en":"Two versions of the same mutual fund. A direct plan is bought straight from the fund house with no distributor commission, so its expense ratio is lower. A regular plan is bought through a distributor and includes their commission.","hi":"एक ही फंड के दो रूप: डायरेक्ट में कमीशन नहीं होता, रेगुलर में वितरक का कमीशन शामिल होता है।","example":"Two versions of the same fund can show different returns over 10 years only because of their different expense ratios.","letter":"D","exh":"एक ही फंड के दो वर्ज़न 10 साल में अलग-अलग रिटर्न दिखा सकते हैं, सिर्फ़ इसलिए कि उनका एक्सपेंस रेशियो अलग है।"},{"term":"Diversification","hindi":"विविधीकरण","en":"Spreading your money across different investments so that one bad investment doesn't hurt you too much. Simply put: don't put all your eggs in one basket.","hi":"पैसे को अलग-अलग जगह लगाना, ताकि एक नुकसान से सब न डूबे।","example":"Instead of putting ₹1,00,000 in one company's shares, you spread it across many companies and asset types.","letter":"D","exh":"₹1,00,000 एक ही कंपनी के शेयर में लगाने की बजाय आप इसे कई कंपनियों और अलग-अलग तरह के निवेशों में बाँटते हैं।"},{"term":"Dividend","hindi":"लाभांश (डिविडेंड)","en":"A part of a company's profit that it may share with its shareholders. Dividends are not guaranteed.","hi":"कंपनी के मुनाफ़े का वह हिस्सा जो शेयरधारकों को दिया जाता है।","example":"If you hold 100 shares and the company declares ₹5 per share, you receive ₹500.","letter":"D","exh":"अगर आपके पास 100 शेयर हैं और कंपनी ₹5 प्रति शेयर डिविडेंड घोषित करती है, तो आपको ₹500 मिलते हैं।"},{"term":"Down payment","hindi":"डाउन पेमेंट","en":"The part of a big purchase you pay from your own money upfront, with the rest coming from a loan. A bigger down payment means a smaller loan.","hi":"बड़ी खरीद में शुरुआत में अपनी जेब से दी जाने वाली रकम।","example":"For a ₹10,00,000 car, paying ₹3,00,000 upfront means you borrow only ₹7,00,000.","letter":"D","exh":"₹10,00,000 की कार के लिए ₹3,00,000 पहले देने पर आपको सिर्फ़ ₹7,00,000 उधार लेने पड़ते हैं।"},{"term":"Emergency fund","hindi":"आपातकालीन कोष","en":"Money kept aside only for surprises like job loss, illness or urgent repairs. Many people aim for 3 to 6 months of essential expenses.","hi":"नौकरी छूटने, बीमारी या अचानक ज़रूरत के लिए अलग रखा गया पैसा।","example":"If your essential costs are ₹25,000 a month, 6 months of cover is ₹1,50,000.","letter":"E","exh":"अगर आपके ज़रूरी खर्च ₹25,000 महीना हैं, तो 6 महीने का कवर ₹1,50,000 है।"},{"term":"EMI","hindi":"ईएमआई (मासिक किस्त)","en":"Equated Monthly Instalment: the fixed amount you pay every month to repay a loan. Each EMI includes part of the loan and part interest.","hi":"कर्ज़ चुकाने के लिए हर महीने दी जाने वाली तय किस्त।","example":"A loan might be repaid with an EMI of ₹8,000 a month for 3 years.","letter":"E","exh":"कोई लोन 3 साल तक ₹8,000 महीने की EMI से चुकाया जा सकता है।"},{"term":"Equity","hindi":"इक्विटी","en":"Ownership in a company, usually through shares. Its value can go up and down a lot, especially in the short term, and returns are never guaranteed.","hi":"शेयरों के ज़रिए किसी कंपनी में हिस्सेदारी।","example":"","letter":"E"},{"term":"Exit load","hindi":"एग्ज़िट लोड","en":"A small fee some mutual funds charge if you withdraw your money before a certain period.","hi":"तय समय से पहले फंड से पैसा निकालने पर लगने वाला शुल्क।","example":"With a 1% exit load, withdrawing ₹50,000 early would cost ₹500.","letter":"E","exh":"1% एग्ज़िट लोड पर ₹50,000 जल्दी निकालने का खर्च ₹500 होगा।"},{"term":"Expense ratio","hindi":"एक्सपेंस रेशियो","en":"The yearly fee a mutual fund charges to manage your money, shown as a percentage of your investment. It is taken out of the fund's value, so a lower ratio leaves more for you.","hi":"म्यूचुअल फंड का सालाना प्रबंधन शुल्क, जो निवेश के प्रतिशत में होता है।","example":"An expense ratio of 1% on ₹1,00,000 is about ₹1,000 a year.","letter":"E","exh":"₹1,00,000 पर 1% एक्सपेंस रेशियो यानी साल में लगभग ₹1,000।"},{"term":"Financial goal","hindi":"वित्तीय लक्ष्य","en":"Something specific you want to pay for in the future, with an amount and a target date, like a child's education or a home down payment.","hi":"भविष्य की किसी ज़रूरत के लिए तय रकम और तय समय वाला लक्ष्य।","example":"\"Save ₹3,00,000 for a car down payment in 3 years.\"","letter":"F","exh":"\"3 साल में कार की डाउन पेमेंट के लिए ₹3,00,000 बचाना।\""},{"term":"Fixed deposit (FD)","hindi":"सावधि जमा (एफडी)","en":"Money you deposit with a bank or institution for a fixed period at an interest rate agreed at the start.","hi":"तय समय के लिए तय ब्याज दर पर जमा की गई रकम।","example":"You deposit ₹50,000 for 2 years and get it back with the agreed interest at maturity.","letter":"F","exh":"आप 2 साल के लिए ₹50,000 जमा करते हैं और मैच्योरिटी पर तय ब्याज के साथ वापस पाते हैं।"},{"term":"Fixed expense","hindi":"स्थिर खर्च","en":"A cost that stays about the same each month, like rent, EMIs, school fees or insurance premiums.","hi":"हर महीने लगभग एक जैसा रहने वाला खर्च, जैसे किराया या ईएमआई।","example":"","letter":"F"},{"term":"Free-look period","hindi":"फ़्री-लुक पीरियड","en":"A short window after buying an insurance policy when you can review it and return it if it doesn't suit you.","hi":"बीमा पॉलिसी खरीदने के बाद का छोटा समय, जिसमें पसंद न आने पर उसे लौटाया जा सकता है।","example":"","letter":"F"},{"term":"Gratuity","hindi":"ग्रेच्युटी","en":"A lump sum some employers pay employees as a thank-you for long service, usually when they leave or retire after several years.","hi":"लंबी सेवा के बाद नौकरी छोड़ने या रिटायर होने पर नियोक्ता द्वारा दी जाने वाली एकमुश्त रकम।","example":"","letter":"G"},{"term":"Gross salary","hindi":"सकल वेतन","en":"Your total salary before deductions like provident fund contribution and tax.","hi":"कटौतियों से पहले का पूरा वेतन।","example":"Gross salary ₹50,000 minus PF and tax deductions might leave a take-home of about ₹44,000.","letter":"G","exh":"₹50,000 सकल वेतन में से PF और टैक्स कटने के बाद हाथ में लगभग ₹44,000 आ सकते हैं।"},{"term":"Guarantor","hindi":"गारंटर (ज़मानतदार)","en":"A person who promises to repay someone else's loan if the borrower can't. Being a guarantor is a serious responsibility.","hi":"वह व्यक्ति जो कर्ज़दार के न चुका पाने पर कर्ज़ चुकाने का वादा करता है।","example":"","letter":"G"},{"term":"Health insurance","hindi":"स्वास्थ्य बीमा","en":"Insurance that pays for hospital and medical costs covered in your policy, in return for a yearly premium. It protects your savings from big medical bills.","hi":"इलाज और अस्पताल के खर्च के लिए बीमा।","example":"A family pays a yearly premium, and when someone is hospitalised the covered ₹2,00,000 bill is paid by the insurer.","letter":"H","exh":"एक परिवार हर साल प्रीमियम देता है, और किसी के अस्पताल में भर्ती होने पर कवर किया गया ₹2,00,000 का बिल बीमा कंपनी चुकाती है।"},{"term":"Home loan","hindi":"गृह ऋण (होम लोन)","en":"A long-term loan to buy or build a house, repaid through EMIs over many years. The house usually acts as security for the loan.","hi":"घर खरीदने या बनाने के लिए लिया गया लंबी अवधि का कर्ज़।","example":"","letter":"H"},{"term":"Impulse buying","hindi":"आवेग में खरीदारी","en":"Buying something on the spot without planning, often because of a sale, an ad or a mood. Small impulse buys add up quickly.","hi":"बिना सोचे-समझे, अचानक कुछ खरीद लेना।","example":"Three ₹400 \"just because\" orders a week add up to about ₹5,000 a month.","letter":"I","exh":"हफ़्ते में तीन बार \"बस यूँ ही\" ₹400 के ऑर्डर, महीने में लगभग ₹5,000 बन जाते हैं।"},{"term":"Income","hindi":"आय","en":"Money you receive, such as salary, business earnings, rent or interest.","hi":"आपको मिलने वाला पैसा, जैसे वेतन, किराया या ब्याज।","example":"","letter":"I"},{"term":"Index fund","hindi":"इंडेक्स फंड","en":"A mutual fund that simply copies a market index by holding the same companies in the same proportion. It usually has lower costs because it isn't actively managed.","hi":"ऐसा फंड जो किसी बाज़ार सूचकांक की नकल करके उन्हीं कंपनियों में निवेश करता है।","example":"","letter":"I"},{"term":"Inflation","hindi":"महंगाई (मुद्रास्फीति)","en":"The general rise in prices over time, which means the same money buys less in the future.","hi":"समय के साथ चीज़ों के दाम बढ़ना, जिससे पैसे की कीमत घटती है।","example":"At an assumed 6% inflation, something costing ₹100 today would cost about ₹106 next year.","letter":"I","exh":"मान लें 6% महँगाई हो, तो आज ₹100 की चीज़ अगले साल लगभग ₹106 की होगी।"},{"term":"Insurance","hindi":"बीमा","en":"A promise from an insurer to pay for certain losses in return for a regular fee called a premium. It moves a big financial risk off your shoulders.","hi":"प्रीमियम के बदले किसी नुकसान की भरपाई का वादा।","example":"","letter":"I"},{"term":"Insurance premium","hindi":"बीमा प्रीमियम","en":"The amount you pay, monthly or yearly, to keep an insurance policy active.","hi":"बीमा पॉलिसी चालू रखने के लिए दी जाने वाली रकम।","example":"Paying ₹12,000 a year to keep a health policy active.","letter":"I","exh":"स्वास्थ्य पॉलिसी चालू रखने के लिए हर साल ₹12,000 चुकाना।"},{"term":"Interest","hindi":"ब्याज","en":"The cost of borrowing money, or the reward for lending or depositing it. It is usually shown as a yearly percentage.","hi":"उधार लेने की कीमत या जमा करने का इनाम।","example":"Depositing ₹10,000 at an assumed 6% a year earns ₹600 of interest in a year.","letter":"I","exh":"मान लें 6% सालाना ब्याज पर ₹10,000 जमा करने से एक साल में ₹600 ब्याज मिलता है।"},{"term":"Investment","hindi":"निवेश","en":"Putting money into something with the aim of growing it over time, like mutual funds, shares, deposits or gold. Investments can go up or down in value.","hi":"पैसे को बढ़ाने के लिए किसी साधन में लगाना।","example":"","letter":"I"},{"term":"IPO","hindi":"आईपीओ","en":"Initial Public Offering: when a company sells its shares to the public for the first time and gets listed on the stock exchange.","hi":"जब कोई कंपनी पहली बार आम लोगों को अपने शेयर बेचती है।","example":"","letter":"I"},{"term":"ITR","hindi":"आयकर रिटर्न (आईटीआर)","en":"Income Tax Return: a form you file with the income tax department each year showing your income, deductions and the tax you have paid.","hi":"हर साल आय, कटौतियों और चुकाए गए टैक्स की जानकारी आयकर विभाग को देने वाला फ़ॉर्म।","example":"","letter":"I"},{"term":"KYC","hindi":"केवाईसी","en":"Know Your Customer: the identity and address check that banks, insurers and investment platforms must do before opening your account.","hi":"खाता खोलने से पहले आपकी पहचान और पते की जाँच।","example":"","letter":"K"},{"term":"Liability","hindi":"देनदारी","en":"Money you owe to others, like loans, unpaid card bills or money borrowed from family.","hi":"आप पर बकाया पैसा, जैसे कर्ज़ या बिल।","example":"A ₹3,00,000 pending car loan is a liability.","letter":"L","exh":"₹3,00,000 का बकाया कार लोन एक देनदारी है।"},{"term":"Lifestyle inflation","hindi":"जीवनशैली महंगाई","en":"When your spending rises every time your income rises, so you never end up saving more.","hi":"आय बढ़ने के साथ खर्च भी उतना ही बढ़ा लेना, जिससे बचत नहीं बढ़ती।","example":"Getting a ₹10,000 raise and spending all ₹10,000 on upgrades instead of saving part of it.","letter":"L","exh":"₹10,000 की वेतन बढ़ोतरी मिलने पर उसका कुछ हिस्सा बचाने की बजाय पूरे ₹10,000 चीज़ें अपग्रेड करने में खर्च कर देना।"},{"term":"Liquidity","hindi":"तरलता","en":"How quickly and easily you can turn something into cash without losing much value. A savings account is very liquid; a house is not.","hi":"किसी चीज़ को कितनी जल्दी और आसानी से नकद में बदला जा सकता है।","example":"","letter":"L"},{"term":"Loan tenure","hindi":"ऋण अवधि","en":"The length of time over which you repay a loan. A longer tenure lowers the EMI but usually means paying more interest in total.","hi":"कर्ज़ चुकाने की कुल अवधि।","example":"","letter":"L"},{"term":"Lump sum","hindi":"एकमुश्त रकम","en":"A single, one-time amount of money paid or invested all at once, rather than in instalments.","hi":"एक साथ एक बार में दी या लगाई गई रकम।","example":"Investing a ₹1,00,000 bonus all at once is a lump-sum investment.","letter":"L","exh":"₹1,00,000 का बोनस एक साथ निवेश करना एकमुश्त (लम्प सम) निवेश है।"},{"term":"Maturity","hindi":"परिपक्वता","en":"The date when a deposit, bond or policy ends and you receive the final amount.","hi":"वह तारीख जब कोई जमा, बॉन्ड या पॉलिसी पूरी होकर रकम मिलती है।","example":"","letter":"M"},{"term":"Minimum amount due","hindi":"न्यूनतम देय राशि","en":"The smallest payment a credit card company accepts to avoid a late fee. Paying only this means interest is charged on the rest, which can grow quickly.","hi":"क्रेडिट कार्ड बिल की वह न्यूनतम रकम जिसे भरने से लेट फ़ीस नहीं लगती, पर बाकी पर ब्याज लगता है।","example":"On a ₹20,000 bill, paying only a ₹1,000 minimum leaves ₹19,000 on which interest is charged.","letter":"M","exh":"₹20,000 के बिल पर सिर्फ़ ₹1,000 का मिनिमम चुकाने से ₹19,000 बचे रहते हैं, जिन पर ब्याज लगता है।"},{"term":"Minimum balance","hindi":"न्यूनतम बैलेंस","en":"The least amount some bank accounts require you to keep. Falling below it can lead to charges.","hi":"खाते में रखी जाने वाली कम से कम रकम।","example":"","letter":"M"},{"term":"Mutual fund","hindi":"म्यूचुअल फंड","en":"A pool of money collected from many investors and managed by professionals, who invest it in shares, bonds or other assets. Its value can go up or down.","hi":"कई लोगों का इकट्ठा पैसा जिसे विशेषज्ञ अलग-अलग जगह निवेश करते हैं।","example":"","letter":"M"},{"term":"NAV","hindi":"एनएवी","en":"Net Asset Value: the price of one unit of a mutual fund on a given day.","hi":"किसी दिन म्यूचुअल फंड की एक यूनिट की कीमत।","example":"If the NAV is ₹50, investing ₹5,000 gets you 100 units.","letter":"N","exh":"अगर NAV ₹50 है, तो ₹5,000 निवेश करने पर आपको 100 यूनिट मिलती हैं।"},{"term":"Needs vs wants","hindi":"ज़रूरतें बनाम इच्छाएँ","en":"Needs are things you must have, like food, rent and medicines. Wants are nice to have, like eating out or a new phone. Telling them apart is the heart of budgeting.","hi":"ज़रूरी चीज़ें (ज़रूरतें) और मन की चीज़ें (इच्छाएँ) में फ़र्क करना।","example":"","letter":"N"},{"term":"Net salary (take-home)","hindi":"शुद्ध वेतन (हाथ में आने वाला)","en":"The salary that actually reaches your bank account after all deductions. Your budget should be based on this number.","hi":"सभी कटौतियों के बाद खाते में आने वाला वेतन।","example":"","letter":"N"},{"term":"Net worth","hindi":"शुद्ध संपत्ति (नेट वर्थ)","en":"What you own minus what you owe. It is the simplest picture of your overall financial health.","hi":"आपकी कुल संपत्ति में से कुल देनदारी घटाने पर बची रकम।","example":"Assets ₹8,00,000 minus loans ₹3,00,000 = net worth ₹5,00,000.","letter":"N","exh":"संपत्ति ₹8,00,000 घटा लोन ₹3,00,000 = नेट वर्थ ₹5,00,000।"},{"term":"No-cost EMI","hindi":"नो-कॉस्ट ईएमआई","en":"An offer to pay for a purchase in instalments with no extra interest shown. The cost may be adjusted through discounts given up or fees, so read the details and use it only for planned needs.","hi":"बिना ब्याज दिखाए किस्तों में खरीदारी का ऑफ़र; शर्तें ध्यान से पढ़ें।","example":"","letter":"N"},{"term":"Nominee","hindi":"नॉमिनी","en":"The person you choose to receive your money, investments or insurance payout if something happens to you. Adding a nominee makes things easier for your family.","hi":"आपके न रहने पर आपका पैसा या बीमा पाने के लिए चुना गया व्यक्ति।","example":"","letter":"N"},{"term":"OTP","hindi":"ओटीपी","en":"One-Time Password: a short code sent to your phone to confirm a transaction or login. Never share an OTP with anyone who calls or messages you.","hi":"लेन-देन की पुष्टि के लिए फ़ोन पर आया एक बार का कोड; इसे किसी से साझा न करें।","example":"","letter":"O"},{"term":"PAN","hindi":"पैन","en":"Permanent Account Number: a 10-character ID given by the income tax department, needed for filing taxes, opening investment accounts and large transactions.","hi":"आयकर विभाग द्वारा दिया गया 10 अक्षरों का स्थायी पहचान नंबर।","example":"","letter":"P"},{"term":"Passive income","hindi":"निष्क्रिय आय","en":"Income that keeps coming in without daily work, like rent or interest. Building it usually takes time and effort upfront.","hi":"बिना रोज़ काम किए नियमित रूप से आने वाली आय, जैसे किराया।","example":"","letter":"P"},{"term":"Payslip","hindi":"वेतन पर्ची","en":"A monthly statement from your employer showing your salary, allowances and deductions.","hi":"नियोक्ता की मासिक पर्ची जिसमें वेतन और कटौतियाँ लिखी होती हैं।","example":"","letter":"P"},{"term":"Pension","hindi":"पेंशन","en":"A regular income received after retirement, from an employer scheme, a government scheme or your own savings.","hi":"रिटायरमेंट के बाद मिलने वाली नियमित आय।","example":"","letter":"P"},{"term":"PF (Provident Fund)","hindi":"भविष्य निधि (पीएफ)","en":"A retirement savings scheme for salaried employees, where both employee and employer contribute a part of salary every month.","hi":"वेतनभोगियों की रिटायरमेंट बचत योजना, जिसमें कर्मचारी और नियोक्ता दोनों योगदान देते हैं।","example":"","letter":"P"},{"term":"Phishing","hindi":"फ़िशिंग","en":"A trick where fraudsters send fake messages, emails or links that look official to steal your passwords, card details or OTPs.","hi":"नकली मैसेज या लिंक भेजकर पासवर्ड या ओटीपी चुराने की धोखाधड़ी।","example":"A message says \"Your KYC is expiring, click here\": that's a common phishing trick.","letter":"P","exh":"मैसेज आता है \"आपका KYC खत्म हो रहा है, यहाँ क्लिक करें\": यह फ़िशिंग की एक आम चाल है।"},{"term":"Ponzi scheme","hindi":"पोंज़ी स्कीम","en":"A fraud that pays old investors using money from new investors, while promising unusually high, \"guaranteed\" returns. It collapses when new money stops coming in.","hi":"नए निवेशकों का पैसा पुराने निवेशकों को देकर चलने वाली धोखाधड़ी।","example":"\"Double your money in 6 months, guaranteed\" is a classic warning sign.","letter":"P","exh":"\"6 महीने में पैसा डबल, गारंटी के साथ\" एक जाना-पहचाना खतरे का संकेत है।"},{"term":"Portfolio","hindi":"पोर्टफ़ोलियो","en":"All your investments taken together, such as funds, deposits, shares and gold.","hi":"आपके सभी निवेशों का कुल समूह।","example":"","letter":"P"},{"term":"PPF","hindi":"पीपीएफ (लोक भविष्य निधि)","en":"Public Provident Fund: a long-term, government-backed savings scheme with a fixed lock-in period. People use it for safe, long-term goals like retirement.","hi":"सरकार समर्थित लंबी अवधि की बचत योजना।","example":"","letter":"P"},{"term":"Prepayment","hindi":"पूर्व भुगतान","en":"Paying off part or all of a loan before its schedule. It can reduce the total interest you pay; check if your loan has any prepayment charges.","hi":"कर्ज़ को तय समय से पहले आंशिक या पूरा चुकाना।","example":"Using a ₹50,000 bonus to prepay a loan reduces the amount on which interest is charged.","letter":"P","exh":"₹50,000 का बोनस लोन के प्रीपेमेंट में लगाने से वह रकम घटती है जिस पर ब्याज लगता है।"},{"term":"Principal","hindi":"मूलधन","en":"The original amount you borrowed or invested, not counting interest.","hi":"उधार लिया या निवेश किया गया मूल पैसा, बिना ब्याज के।","example":"In a ₹2,00,000 loan, ₹2,00,000 is the principal.","letter":"P","exh":"₹2,00,000 के लोन में ₹2,00,000 मूलधन है।"},{"term":"Real return","hindi":"वास्तविक रिटर्न","en":"Your return after adjusting for inflation. It shows how much your buying power actually grew.","hi":"महंगाई घटाने के बाद असली कमाई।","example":"For example, if an investment grows 8% in a year and prices rise 6%, the real return is roughly 2%.","letter":"R","exh":"जैसे, अगर कोई निवेश एक साल में 8% बढ़े और कीमतें 6% बढ़ें, तो वास्तविक रिटर्न लगभग 2% है।"},{"term":"Rebalancing","hindi":"रीबैलेंसिंग","en":"Bringing your investments back to your chosen mix after market moves have changed it.","hi":"बाज़ार के उतार-चढ़ाव के बाद निवेश को फिर से तय अनुपात में लाना।","example":"If your plan is 60% equity but it has grown to 70%, you move some money to bring it back to 60%.","letter":"R","exh":"अगर आपकी योजना 60% इक्विटी की है पर वह बढ़कर 70% हो गई है, तो आप कुछ पैसा दूसरी जगह लगाकर उसे फिर 60% पर लाते हैं।"},{"term":"Recurring deposit (RD)","hindi":"आवर्ती जमा (आरडी)","en":"A deposit where you put in a fixed amount every month for a set period and get it back with interest at the end.","hi":"हर महीने तय रकम जमा करने की योजना, जो अवधि के अंत में ब्याज सहित मिलती है।","example":"Depositing ₹2,000 every month for 12 months puts away ₹24,000 plus interest.","letter":"R","exh":"12 महीने तक हर महीने ₹2,000 जमा करने से ₹24,000 और उस पर ब्याज जमा होता है।"},{"term":"Retirement corpus","hindi":"रिटायरमेंट कोष","en":"The total savings you build up to pay for your living costs after you stop working.","hi":"रिटायरमेंट के बाद के खर्चों के लिए जमा की गई कुल रकम।","example":"","letter":"R"},{"term":"Return","hindi":"रिटर्न (प्रतिफल)","en":"The gain or loss on an investment, often shown as a percentage of the money you put in.","hi":"निवेश पर हुआ लाभ या हानि।","example":"Investing ₹10,000 that becomes ₹11,000 gives a return of ₹1,000, or 10%.","letter":"R","exh":"₹10,000 का निवेश ₹11,000 बन जाए तो रिटर्न ₹1,000 यानी 10% है।"},{"term":"Risk","hindi":"जोखिम","en":"The chance that an investment's value falls or doesn't grow as expected. Usually, investments that may grow more also carry more risk.","hi":"निवेश की कीमत घटने या उम्मीद के मुताबिक न बढ़ने की संभावना।","example":"","letter":"R"},{"term":"Risk appetite","hindi":"जोखिम क्षमता","en":"How much ups and downs in your investments you can handle, both financially and emotionally.","hi":"निवेश में उतार-चढ़ाव सहने की आपकी क्षमता।","example":"","letter":"R"},{"term":"Rule of 72","hindi":"72 का नियम","en":"A quick estimate of how long money takes to double: divide 72 by the yearly growth rate.","hi":"पैसा कितने साल में दोगुना होगा, इसका आसान अंदाज़ा: 72 को सालाना दर से भाग दें।","example":"At an assumed 8% a year, money doubles in about 72 ÷ 8 = 9 years.","letter":"R","exh":"मान लें 8% सालाना पर, पैसा लगभग 72 ÷ 8 = 9 साल में दोगुना होता है।"},{"term":"Rupee-cost averaging","hindi":"रुपया-लागत औसत","en":"Investing a fixed amount regularly, so you buy more units when prices are low and fewer when prices are high. Over time this evens out your average cost.","hi":"नियमित रूप से तय रकम लगाना, जिससे दाम कम होने पर ज़्यादा और ज़्यादा होने पर कम यूनिट मिलें।","example":"₹1,000 buys 20 units at ₹50 but 25 units at ₹40.","letter":"R","exh":"₹50 के भाव पर ₹1,000 से 20 यूनिट मिलती हैं, पर ₹40 के भाव पर 25 यूनिट।"},{"term":"Savings account","hindi":"बचत खाता","en":"A basic bank account to keep money safe, make payments and earn a small interest, with easy withdrawals.","hi":"पैसा सुरक्षित रखने और आसानी से निकालने वाला बैंक खाता।","example":"","letter":"S"},{"term":"Savings rate","hindi":"बचत दर","en":"The share of your income that you save or invest each month.","hi":"आय का वह हिस्सा जो आप हर महीने बचाते या निवेश करते हैं।","example":"Saving ₹8,000 out of ₹40,000 is a 20% savings rate.","letter":"S","exh":"₹40,000 में से ₹8,000 बचाना 20% बचत दर है।"},{"term":"Scam","hindi":"धोखाधड़ी (स्कैम)","en":"A dishonest trick to take your money, often using urgency, fear or promises of easy money. Real banks and officials never ask for your PIN, password or OTP.","hi":"आपका पैसा हड़पने के लिए की गई धोखेबाज़ी।","example":"\"You've won ₹25 lakh! Pay ₹5,000 processing fee to claim\" is a scam.","letter":"S","exh":"\"आपने ₹25 लाख जीते हैं! लेने के लिए ₹5,000 प्रोसेसिंग फ़ीस भरें\" एक घोटाला है।"},{"term":"Share (stock)","hindi":"शेयर","en":"A small unit of ownership in a company. Share prices can rise or fall based on the company's performance and market mood.","hi":"किसी कंपनी में मालिकाना हक़ की एक छोटी इकाई।","example":"","letter":"S"},{"term":"Simple interest","hindi":"साधारण ब्याज","en":"Interest calculated only on the original amount, not on interest already earned.","hi":"केवल मूलधन पर लगने वाला ब्याज।","example":"₹10,000 at an assumed 10% simple interest earns ₹1,000 every year, or ₹2,000 in 2 years.","letter":"S","exh":"मान लें 10% साधारण ब्याज पर ₹10,000 हर साल ₹1,000 कमाते हैं, यानी 2 साल में ₹2,000।"},{"term":"Sinking fund","hindi":"सिंकिंग फंड","en":"Money you set aside bit by bit for a known future expense, like a festival, school fees or insurance renewal, so it doesn't hurt when it arrives.","hi":"किसी तय भविष्य के खर्च के लिए थोड़ा-थोड़ा जमा किया गया पैसा।","example":"Saving ₹2,000 a month for 10 months to have ₹20,000 ready for Diwali.","letter":"S","exh":"दिवाली के लिए ₹20,000 तैयार रखने को 10 महीने तक हर महीने ₹2,000 बचाना।"},{"term":"SIP","hindi":"एसआईपी","en":"Systematic Investment Plan: investing a fixed amount in a mutual fund at regular intervals, usually monthly.","hi":"म्यूचुअल फंड में हर महीने तय रकम निवेश करने का तरीका।","example":"A ₹2,000 monthly SIP puts ₹24,000 to work over a year, a little at a time.","letter":"S","exh":"₹2,000 की मासिक SIP से साल भर में थोड़ा-थोड़ा करके ₹24,000 निवेश होते हैं।"},{"term":"Stock market","hindi":"शेयर बाज़ार","en":"A marketplace where shares of listed companies are bought and sold.","hi":"जहाँ कंपनियों के शेयर खरीदे और बेचे जाते हैं।","example":"","letter":"S"},{"term":"Sum assured","hindi":"बीमा राशि","en":"The amount an insurance policy promises to pay if the insured event happens, such as death in a term plan.","hi":"बीमा होने वाली घटना पर पॉलिसी द्वारा दी जाने वाली तय रकम।","example":"A term plan with a ₹1 crore sum assured pays ₹1 crore to the nominee if the policyholder dies during the term.","letter":"S","exh":"₹1 करोड़ बीमित राशि वाला टर्म प्लान, पॉलिसी अवधि में पॉलिसीधारक की मृत्यु होने पर नॉमिनी को ₹1 करोड़ देता है।"},{"term":"Tax deduction","hindi":"कर कटौती","en":"An amount the tax rules allow you to subtract from your income before tax is worked out, for certain savings or expenses. It lowers your taxable income.","hi":"कुछ बचत या खर्चों के लिए आय में से घटाई जा सकने वाली रकम, जिससे टैक्स योग्य आय कम होती है।","example":"","letter":"T"},{"term":"Taxable income","hindi":"कर योग्य आय","en":"The part of your income on which tax is calculated, after allowed deductions and exemptions.","hi":"कटौतियों के बाद वह आय जिस पर टैक्स लगता है।","example":"","letter":"T"},{"term":"TDS","hindi":"टीडीएस","en":"Tax Deducted at Source: tax taken out in advance from payments like salary or interest before you receive them. It is adjusted when you file your ITR.","hi":"भुगतान मिलने से पहले ही काटा गया टैक्स।","example":"","letter":"T"},{"term":"Term insurance","hindi":"टर्म बीमा","en":"Pure life insurance for a fixed period. If the insured person dies during the term, the nominee gets the sum assured; if not, nothing is paid. It gives large cover for a relatively low premium.","hi":"तय अवधि का शुद्ध जीवन बीमा, जिसमें मृत्यु होने पर नॉमिनी को बीमा राशि मिलती है।","example":"","letter":"T"},{"term":"UPI","hindi":"यूपीआई","en":"Unified Payments Interface: a system for sending and receiving money instantly from your phone using a UPI ID or QR code.","hi":"फ़ोन से तुरंत पैसे भेजने और पाने की प्रणाली।","example":"","letter":"U"},{"term":"UPI PIN","hindi":"यूपीआई पिन","en":"The secret number you enter to approve a UPI payment. You never need to enter your PIN to receive money.","hi":"यूपीआई भुगतान मंज़ूर करने का गुप्त नंबर; पैसे पाने के लिए पिन कभी नहीं डालना पड़ता।","example":"If someone asks you to \"enter PIN to receive ₹2,000\", it's a scam.","letter":"U","exh":"अगर कोई कहे \"₹2,000 पाने के लिए PIN डालें\", तो यह घोटाला है।"},{"term":"Variable expense","hindi":"परिवर्तनशील खर्च","en":"A cost that changes month to month, like groceries, electricity, travel or eating out. These are often the easiest to trim.","hi":"हर महीने बदलने वाला खर्च, जैसे राशन या बिजली।","example":"","letter":"V"},{"term":"Volatility","hindi":"अस्थिरता (उतार-चढ़ाव)","en":"How much and how quickly an investment's price moves up and down.","hi":"किसी निवेश की कीमत में उतार-चढ़ाव की मात्रा।","example":"","letter":"V"},{"term":"Waiting period","hindi":"प्रतीक्षा अवधि","en":"In health insurance, the time after buying a policy during which some illnesses or treatments are not yet covered.","hi":"स्वास्थ्य बीमा में वह समय जिसमें कुछ बीमारियाँ अभी कवर नहीं होतीं।","example":"","letter":"W"},{"term":"Wealth","hindi":"धन (संपत्ति)","en":"The total value of what you own, built over time through saving, investing and avoiding costly debt.","hi":"समय के साथ बचत और निवेश से बनी कुल संपत्ति।","example":"","letter":"W"},{"term":"Will","hindi":"वसीयत","en":"A legal document that says who should get your money and belongings after you pass away. It helps avoid confusion and disputes in the family.","hi":"आपके बाद आपकी संपत्ति किसे मिले, यह बताने वाला कानूनी दस्तावेज़।","example":"","letter":"W"},{"term":"Zero-balance account","hindi":"ज़ीरो-बैलेंस खाता","en":"A bank account that does not require you to keep a minimum balance.","hi":"ऐसा बैंक खाता जिसमें न्यूनतम बैलेंस रखना ज़रूरी नहीं।","example":"","letter":"Z"}];
var lang='en',letter='',q='';try{if((JSON.parse(localStorage.getItem('__GT_TRANSLATE_LANGS')||'{}').tgtLang)==='hi')lang='hi'}catch(e){}
var letters={};DATA.forEach(function(d){letters[d.letter]=1});
$('gl-az').innerHTML='<button type="button" data-l="" aria-pressed="true">All</button>'+'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(function(l){return '<button type="button" data-l="'+l+'" aria-pressed="false"'+(letters[l]?'':' disabled')+'>'+l+'</button>'}).join('');
$('gl-az').addEventListener('click',function(e){var b=e.target.closest('button');if(!b||b.disabled)return;letter=b.getAttribute('data-l');if(letter){q='';$('gl-q').value=''}draw();});
var tm;$('gl-q').addEventListener('input',function(){clearTimeout(tm);tm=setTimeout(function(){q=$('gl-q').value.trim();if(q)letter='';draw()},120)});
function setLang(l){lang=l;draw();}
$('gl-en').onclick=function(){setLang('en')};$('gl-hi').onclick=function(){setLang('hi')};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function norm(s){return String(s).toLowerCase().replace(/[()\-–.,'"]/g,' ').replace(/\s+/g,' ').trim()}
function hl(s){s=esc(s);if(!q)return s;var k=esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');try{return s.replace(new RegExp('('+k+')','gi'),'<mark>$1</mark>')}catch(e){return s}}
function draw(){$('gl-en').setAttribute('aria-pressed',lang==='en');$('gl-hi').setAttribute('aria-pressed',lang==='hi');
 [].forEach.call($('gl-az').querySelectorAll('button'),function(b){b.setAttribute('aria-pressed',b.getAttribute('data-l')===letter)});
 var nq=norm(q),words=nq?nq.split(' '):[];
 var list=DATA.filter(function(d){if(letter&&d.letter!==letter)return false;if(!words.length)return true;var hay=norm(d.term+' '+d.hindi+' '+d.en+' '+d.hi);
  return words.every(function(w){return hay.indexOf(w)>-1})});
 // rank: term matches first
 function rk(d){var t=norm(d.term),h=norm(d.hindi);if(t===nq||h===nq||t.split(' ')[0]===nq)return 0;if((' '+t+' '+h).indexOf(' '+nq)>-1)return 1;if((t+' '+h).indexOf(nq)>-1)return 2;return 3}
 if(nq)list.sort(function(a,b){return rk(a)-rk(b)||a.term.localeCompare(b.term)});
 var hi=lang==='hi';
 $('gl-count').textContent=hi?(list.length+' शब्द दिख रहे हैं'):('Showing '+list.length+' of '+DATA.length+' words'+(letter?' starting with '+letter:''));
 $('gl-list').innerHTML=list.length?list.map(function(d){return '<article class="gl-c"'+(hi?' lang="hi"':'')+'><h4>'+(hi?hl(d.hindi):hl(d.term))+'</h4><div class="gl-alt"'+(hi?' lang="en"':' lang="hi"')+'>'+(hi?hl(d.term):hl(d.hindi))+'</div><p>'+hl(hi?d.hi:d.en)+'</p>'+(d.example?'<div class="gl-ex" lang="'+(hi&&d.exh?'hi':'en')+'"><b>'+(hi?'उदाहरण':'Example')+':</b> '+esc(hi&&d.exh?d.exh:d.example)+'</div>':'')+'</article>'}).join(''):
 '<div class="card gl-empty" style="grid-column:1/-1">'+(hi?'कोई शब्द नहीं मिला। दूसरा शब्द आज़माएँ।':'No words found. Try a different word, or tap "All".')+'</div>';}
draw();
try{var gt='en';try{gt=(JSON.parse(localStorage.getItem('__GT_TRANSLATE_LANGS')||'{}').tgtLang)||'en'}catch(e){}if(gt==='hi'){['gl-list','gl-az','gl-count','gl-q'].forEach(function(id){var RT=document.getElementById(id);if(RT){RT.classList.add('notranslate');RT.setAttribute('translate','no')}});var hb=document.getElementById('gl-hi');if(hb)hb.click()}}catch(e){}
})();
</script>
