<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:F;src:url(Fredoka.ttf)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;font-family:F}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
.abs{position:absolute}
.bubble{position:absolute;background:#fff;border-radius:46px;padding:30px 40px;font-size:56px;font-weight:600;color:#2b1d3a;box-shadow:0 10px 0 rgba(0,0,0,.12);max-width:820px;line-height:1.18}
.big{position:absolute;left:40px;right:40px;text-align:center;font-weight:700;color:#3b1f8f;text-shadow:0 0 0 #fff,-5px -5px 0 #fff,5px -5px 0 #fff,-5px 5px 0 #fff,5px 5px 0 #fff,0 6px 0 #fff,0 -6px 0 #fff,6px 0 0 #fff,-6px 0 0 #fff,0 12px 14px rgba(43,29,58,.25)}
.say{position:absolute;background:#fff;border-radius:44px;padding:58px 40px 30px;font-size:58px;font-weight:600;color:#2b1d3a;box-shadow:0 10px 0 rgba(0,0,0,.12);line-height:1.18;border:8px solid}
.who{position:absolute;left:30px;top:-38px;color:#fff;font-weight:700;font-size:44px;border-radius:40px;padding:6px 30px;letter-spacing:2px}
.tag{position:absolute;left:50%;transform:translateX(-50%);background:#ffb020;color:#2b1d3a;font-weight:700;border-radius:60px;padding:14px 44px;font-size:48px;white-space:nowrap}
</style><script src="characters.js"></script><script src="logo.js"></script></head><body><div id="stage"></div>
<script>
const S=document.getElementById('stage');
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=t=>t<0?0:t>1?1:1-Math.pow(1-t,3);
const pop=t=>{t=clamp(t);return t<.6?ease(t/.6)*1.12:1.12-.12*ease((t-.6)/.4)};

// speech bubble: who='piggu'|'sikka'; bubble bottom edge at baseY; tail tip points at the speaker's head (tx,ty)
const WHO={piggu:{n:'PIGGU',c:'#ff5c8a'},sikka:{n:'SIKKA',c:'#f0a000'}};
function say(who,txt,ts,a,{x,baseY,w,tx,ty}){if(ts<a)return'';const k=pop((ts-a)/0.4),C=WHO[who];
  const bx=Math.max(x+70,Math.min(x+w-70,tx));
  return `<svg class="abs" style="left:0;top:0;overflow:visible" width="1080" height="1920"><path d="M${bx-46} ${baseY-14} L${tx} ${ty} L${bx+46} ${baseY-14} Z" fill="#fff" stroke="${C.c}" stroke-width="8" stroke-linejoin="round" opacity="${Math.min(1,k)}"/></svg>`+
  `<div class="say" style="left:${x}px;bottom:${1920-baseY}px;width:${w}px;box-sizing:border-box;border-color:${C.c};transform:scale(${k});transform-origin:${tx-x}px 100%"><div class="who" style="background:${C.c}">${C.n}</div>${txt}</div>`;}
// big circular think-timer
function timer(ts,a,n,y){if(ts<a||ts>=a+n)return'';const left=n-(ts-a),num=Math.ceil(left),f=1-left/n;
  const r=110,C=2*Math.PI*r;
  return `<svg class="abs" style="left:${540-140}px;top:${y}px" width="280" height="280" viewBox="0 0 280 280"><circle cx="140" cy="140" r="${r}" fill="#fff" stroke="#e8e0ff" stroke-width="26"/><circle cx="140" cy="140" r="${r}" fill="none" stroke="#ff5c8a" stroke-width="26" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*f}" transform="rotate(-90 140 140)"/><text x="140" y="178" text-anchor="middle" font-family="F" font-weight="700" font-size="120" fill="#3b1f8f">${num}</text></svg>`;}
window.say=say;window.timer=timer;
window.EP=null; // episode set by script
function render(t){const ep=window.EP;let h='';
  const sc=ep.scenes.find(s=>t>=s.t0&&t<s.t1)||ep.scenes[ep.scenes.length-1];
  h+=`<div class="abs" style="inset:0;background:${sc.bg||ep.bg}"></div>`;
  h+=`<svg class="abs" width="1080" height="1920" viewBox="0 0 1080 1920" style="left:0;top:0">${(ep.decor||(()=>''))(t)}</svg>`;
  h+=sc.draw(t-sc.t0,t,{pop,ease,clamp});
  // persistent brand corner + episode label
  h+=`<div class="abs" style="right:26px;bottom:22px;font-size:26px;font-weight:600;color:rgba(59,31,143,.55)">© MoneyViel Kids</div>`;
  h+=`<div class="abs" style="left:28px;top:40px;width:250px">${kidsLogo({w:250})}</div><div class="abs" style="left:300px;top:118px;background:#3b1f8f;color:#fff;border-radius:30px;padding:6px 22px;font-size:34px;font-weight:700">Ep ${ep.no}</div>`;
  S.innerHTML=h;}
window.render=render;window.pop=pop;
</script><script src="epkit.js"></script></body></html>
