<script>
(function(){var R=document.getElementById('mv-cc');if(!R)return;var $=function(i){return document.getElementById(i)};
var ac=null,mute=false;try{mute=localStorage.getItem('mvmute')==='1'}catch(e){}$('cc-snd').textContent=mute?'🔇':'🔊';
function tone(f,d,t,v,dl){if(mute)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+(dl||0);o.type=t||'sine';o.frequency.setValueAtTime(f,s);g.gain.setValueAtTime(v||.12,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+d)}catch(e){}}
function sGood(c){tone(520+c*60,.08,'triangle');tone(780+c*60,.12,'triangle',.12,.07)}function sBad(){tone(180,.3,'sawtooth',.08);tone(120,.3,'sawtooth',.08,.1)}function sLv(){[523,659,784,1047].forEach(function(f,i){tone(f,.15,'square',.06,i*.09)})}
$('cc-snd').onclick=function(){mute=!mute;this.textContent=mute?'🔇':'🔊';try{localStorage.setItem('mvmute',mute?'1':'0')}catch(e){}};
function pop(x,y,t,c){var p=document.createElement('div');p.className='pop';p.style.left=x+'px';p.style.top=y+'px';p.style.color=c||'#fff';p.textContent=t;$('cc-st').appendChild(p);setTimeout(function(){p.remove()},900)}
function confetti(n){for(var i=0;i<n;i++){var c=document.createElement('div');c.className='conf';c.style.left=Math.random()*100+'%';c.style.background=['#e0408f','#0f5560','#ffd23f','#7fb6ff','#6fd36f'][i%5];c.style.animationDuration=(1.2+Math.random()*1.4)+'s';c.style.animationDelay=Math.random()*.3+'s';$('cc-st').appendChild(c);(function(c){setTimeout(function(){c.remove()},3000)})(c)}}
var B=[["Best place for an emergency fund?","Savings account","Shopping app wallet","Under the mattress"],["Highest-cost debt usually?","Unpaid credit card dues","Paying a friend back","Your grocery bill"],["Term insurance mainly gives…","Protection for family","Big maturity returns","Free gold"],["Credit score range in India?","300–900","0–100","1–10"],["₹1,000 earning 10% compound for 2 yrs (example)?","₹1,210","₹1,200","₹1,100"],["Inflation does what to cash?","Reduces its value","Increases its value","Nothing"],["Net worth =","Assets − Liabilities","Salary × 12","Bank balance"],["Ideal emergency fund?","3–6 months' expenses","1 week's spending","₹500"],["Diversification means…","Spreading your risk","All eggs in one basket","Cash under mattress"],["A 'want', not a 'need'?","Latest phone upgrade","Groceries","Electricity bill"],["'Pay yourself first' means…","Save before spending","Spend on yourself","Skip bills"],["Longer loan tenure =","More total interest","Less total interest","No interest"],["'Guaranteed 30% a month' is…","A scam","A bank FD","A smart deal"],["Keep credit card use under…","30% of limit","90% of limit","200% of limit"],["KYC stands for…","Know Your Customer","Keep Your Cash","Key Yield Calc"],["BNPL is a…","Loan","Gift","Savings scheme"],["Car value over time usually…","Falls","Rises","Doubles"],["Health policy 20% co-pay on ₹1L bill?","You pay ₹20,000","You pay ₹0","You pay ₹80,000"],["Missing EMIs hurts your…","Credit score","Salary","Insurance"],["Lifestyle inflation is…","Spending every raise","Rising petrol price","A tax"],["50-30-20 rule: 20% goes to…","Savings","Rent","Fun"],["Liability example?","Car loan","Fixed deposit","Gold coin"],["Budget means…","A plan for your money","A bank fee","A loan"],["Track expenses to…","See where money goes","Spend more","Avoid taxes"],["Best time to review subscriptions?","Every few months","Never","Only at year-end"],["A nominee is…","Who gets your money if you die","Your bank manager","A tax form"],["Impulse buy fix?","Wait 24 hours","Buy two","Use a loan"],["Emergency fund is for…","Real emergencies","Holidays","Gadgets"],["Paying only 'minimum due' means…","Interest on the rest","Debt is cleared","Bonus points"],["Before any new loan, check…","EMI vs your income","The bank's logo","Friends' advice"],["A no-cost EMI on things you don't need is…","Still debt","Free money","Savings"],["Good use of a surprise bonus?","Clear costly debt / save","Splurge it all","Lend to strangers"],["Health insurance protects you from…","Big medical bills","Traffic fines","Taxes"],["Scam warning sign?","Pressure to pay now","Written terms","Official website"],["Saving ₹100 a day for a year is about…","₹36,500","₹3,650","₹365"],["Who should know your OTP?","No one","Bank caller","Delivery agent"],["SIP stands for…","Systematic Investment Plan","Single Interest Payment","Savings Insurance Plan"],["A SIP invests…","A fixed amount regularly","Everything at once","Only when prices rise"],["When prices fall, a SIP buys…","More units","Fewer units","No units"],["A mutual fund's NAV is…","Price per unit","Total profit","Bank interest"],["Mutual fund returns are…","Not guaranteed","Fixed by law","Always 12%"],["A fund's expense ratio is…","Its yearly fee","A tax","A bonus"],["Term insurance pays out on…","Death, to the family","Hospital bills","Car repairs"],["Higher possible return usually means…","Higher risk","No risk","Sure profit"],["Before taking investment advice, check the adviser is…","SEBI-registered","Famous online","A relative"]];
var st=null,raf=0,last=0,best=0;try{best=+localStorage.getItem('mvcc')||0}catch(e){}if(best)$('cc-best').textContent='Best score: '+best;
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function start(){st={sc:0,lives:3,lv:1,ok:0,combo:1,deck:shuffle(B),qi:0,clouds:[],speed:.1,alive:true,wait:false};$('cc-ov').style.display='none';hud();theme();next();last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function hud(){$('cc-lives').textContent='❤️'.repeat(st.lives)+'🤍'.repeat(3-st.lives);$('cc-sc').textContent=st.sc;$('cc-lv').textContent='LV '+st.lv;$('cc-combo').textContent=st.combo>1?'🔥 Combo x'+st.combo:''}
function theme(){var T=[['linear-gradient(#7fb6ff,#c7e2ff 60%,#ffe9f4)','#ffd23f','14%'],['linear-gradient(#ff9a8b,#ffc3a0 55%,#ffe9d6)','#ff8c42','40%'],['linear-gradient(#2b2d6e,#6b4fa0 60%,#c77dff)','#f1f1ff','12%']][Math.min(2,Math.floor((st.lv-1)/2))];$('cc-sky').style.background=T[0];$('cc-sun').style.background='radial-gradient(#fff,'+T[1]+')';$('cc-sun').style.boxShadow='0 0 50px '+T[1];$('cc-sun').style.top=T[2]}
function next(){$('cc-field').innerHTML='';st.clouds=[];if(st.qi>=st.deck.length){st.deck=shuffle(B);st.qi=0}var q=st.deck[st.qi++];$('cc-q').textContent=q[0];
var opts=shuffle([[q[1],1],[q[2],0],[q[3],0]]),lanes=shuffle([2,34,66]),H=$('cc-st').clientHeight;
opts.forEach(function(o,i){var d=document.createElement('div');d.className='cl';d.textContent=o[0];d.style.left=lanes[i]+'%';var c={el:d,y:-90-i*55-Math.random()*40,ok:o[1],dead:false};d.style.top=c.y+'px';
d.addEventListener('pointerdown',function(e){e.preventDefault();tap(c,e)});$('cc-field').appendChild(d);st.clouds.push(c)});st.wait=false;}
function tap(c,e){if(!st.alive||st.wait||c.dead)return;var r=$('cc-st').getBoundingClientRect(),x=(e.clientX||r.left+r.width/2)-r.left,y=(e.clientY||r.top+200)-r.top;
if(c.ok){c.dead=true;c.el.classList.add('ok');var pts=10*st.combo;st.sc+=pts;st.ok++;sGood(st.combo);pop(x-20,y-30,'+'+pts,'#fff');st.combo=Math.min(st.combo+1,8);st.wait=true;
if(st.ok%5===0){st.lv++;st.speed*=1.18;sLv();pop(r.width/2-60,r.height/2-40,'LEVEL UP! 🚀','#ffd23f');theme();confetti(30)}hud();setTimeout(function(){if(st.alive)next()},450)}
else{c.dead=true;c.el.classList.add('no');c.el.textContent='⚡ '+c.el.textContent;miss(x,y)}}
function miss(x,y){st.lives--;st.combo=1;sBad();$('cc-st').classList.remove('shake');void $('cc-st').offsetWidth;$('cc-st').classList.add('shake');pop(x-20,y-30,'💔','#fff');hud();if(st.lives<=0)over()}
function loop(t){var dt=Math.min(50,t-last);last=t;if(st&&st.alive&&!st.wait){var H=$('cc-st').clientHeight,ground=H*0.89-70-44;
for(var i=0;i<st.clouds.length;i++){var c=st.clouds[i];if(c.ok&&c.dead)continue;c.y+=st.speed*dt*(H/600);c.el.style.top=c.y+'px';
if(c.ok&&!c.dead&&c.y>ground){c.dead=true;c.el.classList.add('reveal');st.wait=true;miss(c.el.offsetLeft+40,ground);if(st.alive)setTimeout(function(){if(st.alive)next()},1100);break}}}
raf=requestAnimationFrame(loop)}
function over(){st.alive=false;var nb=st.sc>best;if(nb){best=st.sc;try{localStorage.setItem('mvcc',best)}catch(e){}}setTimeout(function(){
var txt='I scored '+st.sc+' in Cloud Catcher ☁️ on MoneyViel (level '+st.lv+')! Can you beat me? '+location.href.split('?')[0];
$('cc-ov').innerHTML='<div style="font-size:56px">'+(nb?'🏆':'☁️')+'</div><h2>'+(nb?'New best!':'Game over')+'</h2><div class="big">'+st.sc+'</div><p style="margin-top:8px">Level '+st.lv+' · '+st.ok+' correct answers</p><div class="share"><button class="gbtn" id="cc-re" type="button">↻ Play again</button><a class="gbtn sec" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(txt)+'">Share</a></div>';
$('cc-ov').style.display='flex';$('cc-re').onclick=start;if(nb)confetti(60)},700)}
$('cc-go').onclick=start;
})();
</script>
